<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none" stroke="#1f4d36" stroke-opacity="0.07" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
