services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recicla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recicla_local}
      POSTGRES_DB: ${POSTGRES_DB:-recicla_aqui}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: recicla_pgdata
